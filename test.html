<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goonsquad Bet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ---- OFP design system (ported tokens + components) ---- */
  :root {
    --bg: #272e4e;
    --bar: #1d2240;
    --panel: #2b3258;
    --panel-deep: #222848;
    --btn: #232a4c;
    --btn-border: #3a4270;
    --line: #3a4270;
    --ink: #f2f4fa;
    --muted: #8e97b8;
    --blue: #6fb2e8;
    --cyan: #5bc8f5;
    --red: #e5697a;
    --green: #58c48a;
    --orange: #e0a44a;
    --chip-bg: #4fa8dd;
    --sel: #4fa8dd;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    font-size: 15px; line-height: 1.5; padding-bottom: 72px;
  }
  button { font: inherit; cursor: pointer; }
  input, select { font: inherit; }
  a { color: var(--cyan); }
  .num { font-variant-numeric: tabular-nums; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; gap: 1rem;
    padding: 0.6rem 1.1rem; background: var(--bar);
    position: sticky; top: 0; z-index: 40; flex-wrap: wrap;
  }
  .brand { font-weight: 800; font-size: 1.15rem; color: var(--ink); letter-spacing: 0.01em; flex-shrink: 0; }
  .brand span { color: var(--cyan); }
  .topbar nav { display: flex; gap: 0.15rem; flex-wrap: wrap; }
  .topbar nav button {
    background: none; border: none; color: var(--ink); padding: 0.35rem 0.7rem;
    border-radius: 6px; font-weight: 600; font-size: 0.92rem;
  }
  .topbar nav button.active { color: var(--cyan); }
  .topbar nav button:hover { color: var(--cyan); }
  .top-stats { margin-left: auto; display: flex; gap: 1.2rem; align-items: center; }
  .stat { text-align: right; }
  .stat .k { font-size: 0.7rem; font-weight: 700; color: var(--muted); display: block; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.03em; }
  .stat .v { font-weight: 800; color: var(--cyan); font-variant-numeric: tabular-nums; font-size: 1.02rem; }
  .stat .v.neg { color: var(--red); }
  .stat .v.pos { color: var(--green); }
  .role-tag {
    font-size: 0.6rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--cyan); border: 1px solid var(--cyan); border-radius: 999px; padding: 0.05rem 0.45rem; margin-left: 0.4rem;
  }
  .ghost-link { background: none; border: none; color: var(--muted); font-size: 0.82rem; }
  .ghost-link:hover { color: var(--ink); }

  .app { max-width: 60rem; margin: 0 auto; padding: 1rem 1.1rem 3rem; }
  .page-head { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin: 0.4rem 0 1rem; }
  .page-title { margin: 0; font-size: 1.3rem; font-weight: 800; }
  .page-sub { color: var(--muted); font-size: 0.85rem; margin: 0.1rem 0 0; }

  /* Segmented control */
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--btn-border); border-radius: 8px; padding: 2px; margin-left: auto; }
  .seg-btn { background: none; border: none; color: var(--muted); font-weight: 700; font-size: 0.82rem; padding: 0.3rem 0.8rem; border-radius: 6px; }
  .seg-btn.on { background: var(--chip-bg); color: #0e1430; }
  .seg-btn:not(.on):hover { color: var(--ink); }

  /* Day divider */
  .day-divider { color: var(--muted); font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.1rem 0 0.5rem; }

  /* Event + bet cards */
  .event-card { background: var(--panel-deep); border-radius: 10px; padding: 0.9rem 1rem 1rem; margin-bottom: 0.9rem; }
  .event-head { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.2rem; }
  .event-title { font-weight: 800; font-size: 1.05rem; }
  .event-sub { color: var(--muted); font-size: 0.8rem; }
  .phase-tag { font-size: 0.64rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.06rem 0.45rem; }
  .phase-tag.open { color: var(--green); border-color: var(--green); }
  .phase-tag.locked { color: var(--red); border-color: var(--red); }
  .phase-tag.settled { color: var(--cyan); border-color: var(--cyan); }

  .bet-block { border-top: 1px solid var(--line); padding: 0.6rem 0 0.2rem; margin-top: 0.5rem; }
  .bet-label { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 0.45rem; text-transform: uppercase; letter-spacing: 0.03em; }
  .opt-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .opt-pill {
    background: var(--btn); border: 1px solid var(--btn-border); border-radius: 8px;
    padding: 0.5rem 0.9rem; font-size: 0.9rem; font-weight: 700; color: var(--ink);
    display: flex; gap: 0.5rem; align-items: center;
  }
  .opt-pill .od { color: var(--blue); font-variant-numeric: tabular-nums; }
  .opt-pill:hover:not(.locked) { border-color: var(--chip-bg); }
  .opt-pill.mine { border-color: var(--chip-bg); background: #31548022; }
  .opt-pill.won { border-color: var(--green); color: var(--green); }
  .opt-pill.won .od { color: var(--green); }
  .opt-pill.lost { opacity: 0.5; text-decoration: line-through; }
  .opt-pill.locked { cursor: default; }

  /* Generic cards / tickets */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.75rem; margin-bottom: 0.55rem; }
  .card-top { display: flex; align-items: center; gap: 0.5rem; }
  .card-top .lbl { font-weight: 700; font-size: 0.92rem; }
  .card-top .amt { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .card-sub { color: var(--muted); font-size: 0.8rem; margin-top: 0.15rem; }
  .chip { font-size: 0.68rem; font-weight: 800; border-radius: 999px; padding: 0.12rem 0.55rem; background: var(--chip-bg); color: #0e1430; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.03em; }
  .chip.won { background: var(--green); }
  .chip.lost { background: var(--red); }
  .chip.push { background: var(--muted); }
  .chip.pending { background: var(--chip-bg); }
  .amt.pos { color: var(--green); } .amt.neg { color: var(--red); }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  .tbl th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 0.55rem 0.75rem; background: var(--panel-deep); }
  .tbl td { padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl th.r, .tbl td.r { text-align: right; }
  .tbl tr.me td { background: rgba(79, 168, 221, 0.10); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.72rem; vertical-align: middle; margin-right: 0.5rem; }

  /* Buttons */
  .btn { background: var(--chip-bg); color: #0e1430; border: none; border-radius: 7px; padding: 0.5rem 1rem; font-weight: 700; font-size: 0.9rem; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-block { display: block; width: 100%; }
  .btn-ghost { background: var(--btn); color: var(--ink); border: 1px solid var(--btn-border); border-radius: 7px; padding: 0.5rem 1rem; font-weight: 700; font-size: 0.88rem; }
  .btn-sm { padding: 0.32rem 0.7rem; font-size: 0.8rem; border-radius: 6px; }
  .btn-green { background: var(--green); color: #0e1430; }
  .btn-red { background: var(--red); color: #0e1430; }
  .btn-orange { background: var(--orange); color: #0e1430; }
  .btn-gray { background: var(--btn); color: var(--muted); border: 1px solid var(--btn-border); }

  /* Forms */
  .field { display: block; margin-bottom: 0.7rem; }
  .field > span { display: block; font-size: 0.74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 0.25rem; }
  .field input, .field select, .inp {
    width: 100%; padding: 0.5rem 0.6rem; border: 1px solid var(--btn-border);
    border-radius: 7px; background: var(--btn); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .admin-panel { background: var(--panel-deep); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
  .admin-panel h3 { margin: 0 0 0.3rem; font-size: 1rem; }
  .admin-panel .note { color: var(--muted); font-size: 0.8rem; margin: 0 0 0.8rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .row-tight { display: flex; gap: 0.4rem; align-items: center; }
  .check { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-weight: 700; }
  .check input { width: 1.1rem; height: 1.1rem; }
  .sub-inputs { margin: 0.3rem 0 0.6rem 1.6rem; padding-left: 0.8rem; border-left: 2px solid var(--line); }

  /* Auth */
  .auth-page { max-width: 24rem; margin: 3rem auto; padding: 0 1rem; text-align: center; }
  .auth-title { font-size: 1.6rem; font-weight: 800; }
  .auth-title span { color: var(--cyan); }
  .auth-sub { color: var(--muted); margin: 0.2rem 0 1.4rem; }
  .auth-card { background: var(--panel-deep); border-radius: 10px; padding: 1.1rem; text-align: left; margin-bottom: 1rem; }
  .auth-card h2 { font-size: 1rem; margin: 0 0 0.7rem; }
  .divider { color: var(--muted); font-size: 0.8rem; margin: 0.8rem 0; }
  .err { color: var(--red); font-size: 0.85rem; margin-top: 0.6rem; }
  .ok { color: var(--green); font-size: 0.85rem; margin-top: 0.6rem; }
  .callout { background: var(--panel); border: 1px solid var(--btn-border); border-radius: 8px; padding: 0.8rem; font-size: 0.88rem; }

  /* Bet slip (bottom sheet) */
  .slip { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bar); border-top: 1px solid var(--btn-border); padding: 0.9rem 1.1rem; box-shadow: 0 -6px 18px rgba(0,0,0,0.4); z-index: 100; }
  .slip-inner { max-width: 60rem; margin: 0 auto; }
  .slip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.6rem; }
  .slip-head .lbl { font-weight: 800; }
  .slip-head .sub { color: var(--muted); font-size: 0.8rem; }
  .slip-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; }
  .slip-row { display: flex; gap: 0.5rem; align-items: center; }
  .slip-row input { flex: 1; min-width: 0; padding: 0.6rem; border: 1px solid var(--btn-border); border-radius: 7px; background: var(--btn); color: var(--ink); font-variant-numeric: tabular-nums; }
  .slip-calc { color: var(--green); font-size: 0.85rem; margin-top: 0.5rem; font-weight: 700; }
  .slip-err { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }

  .empty { text-align: center; color: var(--muted); padding: 3rem 0; font-size: 0.95rem; }

  .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background: #0e1430; border: 1px solid var(--btn-border); color: var(--ink); padding: 0.6rem 1.1rem; border-radius: 999px; font-size: 0.88rem; z-index: 999; opacity: 0; transition: opacity 0.25s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: var(--red); }

  @media (max-width: 560px) {
    .top-stats { width: 100%; margin-left: 0; justify-content: space-between; }
    .seg { margin-left: 0; }
    .page-head { gap: 0.5rem; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
  sendSignInLinkToEmail, isSignInWithEmailLink, signInWithEmailLink, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ============================================================
   CONFIG — the only block Rex edits before deploying
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDpnbCag54EDtOrwkocmIummeZJ9vpr00k",
  authDomain:        "goonsquad-futbol.firebaseapp.com",
  projectId:         "goonsquad-futbol",
  storageBucket:     "goonsquad-futbol.firebasestorage.app",
  messagingSenderId: "518391194891",
  appId:             "1:518391194891:web:d16cead641b9e3c1a0ae0e",
};

/* ROSTER.  One row per person.
   - email:    the address they sign in with (case-insensitive).
   - name:     how they show up in the app.
   - role:     "commissioner" (full control), "linemaker" (create/edit lines only), or "player".
   - legacyId: their existing key in Firestore so old balances/bets carry over.
               Keep R3/Une/AK/Brez exactly as-is — every balance and bet already
               stored stays attached to the right person.
   Brez is "Rainman": the line-maker (creates/edits/locks events, no grading).
   Only emails in this list can use the app; anyone else is told to ask Rex. */
const MEMBERS = [
  { legacyId: "R3",   name: "Rex",  email: "hamiltonra25@gmail.com", role: "commissioner" },
  { legacyId: "Une",  name: "Une",  email: "pietrowitj14@gmail.com", role: "player" },
  { legacyId: "AK",   name: "AK",   email: "klemensam14@gmail.com",  role: "player" },
  { legacyId: "Brez", name: "Brez", email: "cbrezovar11@gmail.com",  role: "linemaker" },
];
/* ============================================================ */

const COLORS   = ["#5bc8f5", "#58c48a", "#e0a44a", "#b58be0", "#e5697a", "#6fb2e8"];
const BGS      = ["#1f3a55", "#1f3f33", "#3f3320", "#33264a", "#3f2430", "#223048"];

let db, auth;
let currentMember = null;        // resolved MEMBERS row for the signed-in user
let authEmail = null;            // raw signed-in email (may not be a member)
let activeTab = "board";
let settledScope = "all";        // Settled page: all | me
let events = [];                 // custom_events
let cBets = [];                  // custom_bets
let cBalances = {};              // custom_balances (keyed by legacyId)
let selected = null;             // bet slip selection
let editingEventId = null;
let createDraft = null;          // typed-event create form state
let unsubEvents = null, unsubBets = null, unsubBals = null;

const appEl = document.getElementById("app");

/* ---------- helpers ---------- */
function toast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (type === "error" ? " error" : "");
  setTimeout(() => { t.className = "toast"; }, 2600);
}
function fmtOdds(o) { return o > 0 ? "+" + o : "" + o; }
function calcPayout(wager, odds) {
  const raw = odds > 0 ? wager * odds / 100 : wager * 100 / Math.abs(odds);
  return Math.round(raw * 100) / 100;
}
function fmtMoney(n) {
  const v = Number(n) || 0;
  return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function signedMoney(n) {
  const v = Number(n) || 0;
  return (v < 0 ? "-$" : "+$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}
function memberByEmail(email) {
  const e = (email || "").trim().toLowerCase();
  return MEMBERS.find(m => m.email.trim().toLowerCase() === e) || null;
}
function memberById(id) { return MEMBERS.find(m => m.legacyId === id) || null; }
function nameOf(id) { const m = memberById(id); return m ? m.name : id; }
function colorFor(id) { const i = MEMBERS.findIndex(m => m.legacyId === id); return COLORS[i % COLORS.length]; }
function bgFor(id) { const i = MEMBERS.findIndex(m => m.legacyId === id); return BGS[i % BGS.length]; }
function initialsOf(id) { const n = nameOf(id); return n.slice(0, 2).toUpperCase(); }
function isCommish() { return currentMember && currentMember.role === "commissioner"; }
function canCreate() { return currentMember && (currentMember.role === "commissioner" || currentMember.role === "linemaker"); }
function myId() { return currentMember ? currentMember.legacyId : null; }

function isEventLocked(ev) {
  if (ev.locked) return true;
  if (ev.ignoreTimeLock) return false;          // explicitly opened "active now"
  if (ev.startTime && Date.now() >= ev.startTime) return true;
  return false;
}
function fmtDateLabel(ms) {
  if (!ms) return "";
  return new Date(ms).toLocaleString("en-US", {
    timeZone: "America/Chicago", weekday: "short", month: "short", day: "numeric",
    hour: "numeric", minute: "2-digit", hour12: true
  }).replace(",", " ·") + " CT";
}
function dayLabel(ms) {
  if (!ms) return "No date set";
  return new Date(ms).toLocaleDateString("en-US", { timeZone: "America/Chicago", weekday: "long", month: "short", day: "numeric" });
}
function toDatetimeLocal(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- firebase ---------- */
function initFirebase() {
  const fbApp = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(fbApp);
  auth = getAuth(fbApp);
}
function subscribe() {
  if (unsubEvents || unsubBets || unsubBals) return;
  unsubEvents = onSnapshot(collection(db, "custom_events"), snap => {
    events = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    events.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    render();
  });
  unsubBets = onSnapshot(collection(db, "custom_bets"), snap => {
    cBets = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  unsubBals = onSnapshot(collection(db, "custom_balances"), snap => {
    cBalances = {};
    snap.docs.forEach(d => { cBalances[d.id] = d.data().amount ?? 0; });
    render();
  });
}
function unsubscribeAll() {
  if (unsubEvents) unsubEvents(); if (unsubBets) unsubBets(); if (unsubBals) unsubBals();
  unsubEvents = unsubBets = unsubBals = null;
}
async function ensureBalance(id) {
  const ref = doc(db, "custom_balances", id);
  const snap = await getDoc(ref);
  if (!snap.exists()) await setDoc(ref, { amount: 0 });
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  // Not signed in → sign-in page.
  if (!authEmail) { appEl.innerHTML = renderSignIn(); wireSignIn(); return; }
  // Signed in but not on the roster → access screen.
  if (!currentMember) { appEl.innerHTML = renderNotMember(); wireNotMember(); return; }

  const bal = cBalances[myId()] ?? 0;
  let html = renderTopbar(bal);
  html += `<div class="app">`;
  if (activeTab === "board")     html += renderBoard();
  if (activeTab === "active")    html += renderActive();
  if (activeTab === "settled")   html += renderSettled();
  if (activeTab === "standings") html += renderStandings();
  if (activeTab === "admin" && canCreate()) html += renderAdmin();
  html += `</div>`;
  appEl.innerHTML = html;
  wireMain();
}

function renderTopbar(bal) {
  const tabs = [["board","Board"],["active","Active"],["settled","Settled"],["standings","Standings"]];
  if (canCreate()) tabs.push(["admin","Admin"]);
  const roleTag = currentMember.role !== "player"
    ? `<span class="role-tag">${currentMember.role === "commissioner" ? "Commish" : "Lines"}</span>` : "";
  const balCls = bal < 0 ? "neg" : (bal > 0 ? "pos" : "");
  return `
  <div class="topbar">
    <div class="brand">Goonsquad<span>Bet</span></div>
    <nav>
      ${tabs.map(([k,l]) => `<button data-tab="${k}" class="${activeTab===k?"active":""}">${l}</button>`).join("")}
    </nav>
    <div class="top-stats">
      <div class="stat"><span class="k">${esc(currentMember.name)}${roleTag}</span>
        <span class="v ${balCls} num">${fmtMoney(bal)}</span></div>
      <button class="ghost-link" id="signout">Sign out</button>
    </div>
  </div>`;
}

/* ---------- Board: open events to bet ---------- */
function renderBoard() {
  const open = events.filter(e => !e.archived);
  if (open.length === 0) return `<div class="empty">No events posted yet.${canCreate() ? " Head to Admin to create one." : ""}</div>`;

  // Sort by start time (no-date last), group by day.
  const sorted = [...open].sort((a, b) => (a.startTime || Infinity) - (b.startTime || Infinity));
  let html = "", lastDay = null;
  sorted.forEach(ev => {
    const locked = isEventLocked(ev);
    const allSettled = (ev.bets || []).length > 0 && (ev.bets || []).every(b => b.settled);
    const d = dayLabel(ev.startTime);
    if (d !== lastDay) { html += `<div class="day-divider">${d}</div>`; lastDay = d; }

    const phase = allSettled ? `<span class="phase-tag settled">Settled</span>`
                : locked ? `<span class="phase-tag locked">Locked</span>`
                : `<span class="phase-tag open">Open</span>`;
    html += `<div class="event-card">
      <div class="event-head">
        <span class="event-title">${esc(ev.title)}</span>${phase}
      </div>
      <div class="event-sub">${esc(ev.subtitle || "")}</div>`;

    (ev.bets || []).forEach((bet, bIdx) => {
      html += `<div class="bet-block"><div class="bet-label">${esc(bet.label)}</div><div class="opt-row">`;
      (bet.options || []).forEach((opt, oIdx) => {
        const mine = cBets.find(b => b.player === myId() && b.eventId === ev.id && b.betIdx === bIdx && b.optIdx === oIdx && b.status !== "deleted");
        const settled = bet.settled;
        const winner = bet.winnerIdx === oIdx;
        let cls = "opt-pill";
        if (mine) cls += " mine";
        if (settled) cls += winner ? " won" : " lost";
        if (locked || settled) cls += " locked";
        html += `<span class="${cls}" data-event="${ev.id}" data-bidx="${bIdx}" data-oidx="${oIdx}"
          data-odds="${opt.odds}" data-label="${esc(opt.label)}" data-betlabel="${esc(bet.label)}"
          data-eventtitle="${esc(ev.title)}" data-locked="${locked || settled ? "1" : "0"}">
          <span>${esc(opt.label)}</span><span class="od">${fmtOdds(opt.odds)}</span></span>`;
      });
      html += `</div></div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ---------- Active: my pending tickets ---------- */
function renderActive() {
  const mine = cBets.filter(b => b.player === myId() && b.status === "pending")
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  let html = `<div class="page-head"><h1 class="page-title">Active</h1></div>`;
  if (mine.length === 0) return html + `<div class="empty">No open bets. Place one from the Board.</div>`;
  const risk = mine.reduce((s, b) => s + (b.wager || 0), 0);
  const pot  = mine.reduce((s, b) => s + (b.wager || 0) + (b.toWin || 0), 0);
  html += `<p class="page-sub">${mine.length} open · ${fmtMoney(risk)} at risk · ${fmtMoney(pot)} back if all hit</p>`;
  mine.forEach(b => { html += ticketCard(b, "pending"); });
  return html;
}

function ticketCard(b, status) {
  const chip = { pending:"pending", won:"won", lost:"lost", push:"push" }[status] || "pending";
  const chipLbl = { pending:"Pending", won:"Won", lost:"Lost", push:"Push" }[status] || status;
  return `<div class="card">
    <div class="card-top"><span class="lbl">${esc(b.eventTitle)}</span><span class="chip ${chip}">${chipLbl}</span></div>
    <div class="card-sub">${esc(b.betLabel)} · <strong>${esc(b.optionLabel)}</strong> ${fmtOdds(b.odds)}
      · Wager ${fmtMoney(b.wager)} · To win ${fmtMoney(b.toWin)}</div>
  </div>`;
}

/* ---------- Settled: history (everyone by default) ---------- */
function renderSettled() {
  let html = `<div class="page-head"><h1 class="page-title">Settled</h1>
    <div class="seg">
      <button class="seg-btn ${settledScope==="all"?"on":""}" data-scope="all">Everyone</button>
      <button class="seg-btn ${settledScope==="me"?"on":""}" data-scope="me">Just me</button>
    </div></div>`;
  let done = cBets.filter(b => ["won","lost","push"].includes(b.status));
  if (settledScope === "me") done = done.filter(b => b.player === myId());
  if (done.length === 0) return html + `<div class="empty">Nothing settled yet.</div>`;
  done.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  done.forEach(b => {
    const delta = b.status === "won" ? b.toWin : b.status === "lost" ? -b.wager : 0;
    const amtCls = delta > 0 ? "pos" : delta < 0 ? "neg" : "";
    const chip = b.status;
    const chipLbl = { won:"Won", lost:"Lost", push:"Push" }[b.status];
    html += `<div class="card">
      <div class="card-top">
        <span class="avatar" style="background:${bgFor(b.player)};color:${colorFor(b.player)}">${initialsOf(b.player)}</span>
        <span class="lbl">${esc(nameOf(b.player))}</span>
        <span class="chip ${chip}">${chipLbl}</span>
        <span class="amt ${amtCls} num">${delta===0?"push":signedMoney(delta)}</span>
      </div>
      <div class="card-sub">${esc(b.eventTitle)} · ${esc(b.betLabel)} · ${esc(b.optionLabel)} ${fmtOdds(b.odds)}</div>
    </div>`;
  });
  return html;
}

/* ---------- Standings: cumulative bankroll ---------- */
function renderStandings() {
  const rows = MEMBERS.map(m => {
    const pb = cBets.filter(b => b.player === m.legacyId && b.status !== "deleted");
    return {
      id: m.legacyId, name: m.name,
      bal: cBalances[m.legacyId] ?? 0,
      won: pb.filter(b => b.status === "won").length,
      lost: pb.filter(b => b.status === "lost").length,
      push: pb.filter(b => b.status === "push").length,
      pending: pb.filter(b => b.status === "pending").length,
      atRisk: pb.filter(b => b.status === "pending").reduce((s, b) => s + (b.wager || 0), 0),
    };
  }).sort((a, b) => b.bal - a.bal);

  let html = `<div class="page-head"><h1 class="page-title">Standings</h1></div>`;
  html += `<table class="tbl"><thead><tr>
    <th>#</th><th>Player</th><th class="r">W-L-P</th><th class="r">At risk</th><th class="r">Balance</th>
  </tr></thead><tbody>`;
  rows.forEach((r, i) => {
    const meCls = r.id === myId() ? "me" : "";
    const balCls = r.bal < 0 ? "neg" : r.bal > 0 ? "pos" : "";
    html += `<tr class="${meCls}">
      <td>${i + 1}</td>
      <td><span class="avatar" style="background:${bgFor(r.id)};color:${colorFor(r.id)}">${initialsOf(r.id)}</span>${esc(r.name)}</td>
      <td class="r">${r.won}-${r.lost}-${r.push}${r.pending ? ` <span style="color:var(--muted)">(${r.pending})</span>` : ""}</td>
      <td class="r">${r.atRisk ? fmtMoney(r.atRisk) : "—"}</td>
      <td class="r amt ${balCls}">${fmtMoney(r.bal)}</td>
    </tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderManageCard(ev) {
  const locked = isEventLocked(ev);
  let html = `<div class="event-card">
    <div class="event-head"><span class="event-title">${esc(ev.title)}</span>
      ${locked ? `<span class="phase-tag locked">Locked</span>` : `<span class="phase-tag open">Open</span>`}</div>
    <div class="event-sub">${esc(ev.subtitle || "")}</div>
    <div class="row" style="margin:0.5rem 0;">
      <button class="btn-ghost btn-sm" data-editev="${ev.id}">Edit</button>
      <button class="btn-ghost btn-sm" data-lockev="${ev.id}" data-locked="${ev.locked?"1":"0"}">${ev.locked?"Unlock":"Lock"}</button>
      ${isCommish() ? `<button class="btn-red btn-sm" data-delev="${ev.id}">Delete</button>` : ""}
    </div>`;

  (ev.bets || []).forEach((bet, bIdx) => {
    const lineBets = cBets.filter(b => b.eventId === ev.id && b.betIdx === bIdx && b.status !== "deleted");
    const pending = lineBets.filter(b => b.status === "pending");
    const graded  = lineBets.filter(b => b.status !== "pending");
    html += `<div class="bet-block"><div class="bet-label">${esc(bet.label)}</div>`;

    // Grading — commissioner only, while any pending remain
    if (isCommish() && (!bet.settled || pending.length > 0)) {
      html += `<div class="opt-row">`;
      (bet.options || []).forEach((opt, oIdx) => {
        html += `<button class="btn-green btn-sm" data-settleev="${ev.id}" data-bidx="${bIdx}" data-oidx="${oIdx}">${esc(opt.label)} won</button>`;
      });
      html += `<button class="btn-red btn-sm" data-losev="${ev.id}" data-bidx="${bIdx}">No winner</button>`;
      html += `<button class="btn-orange btn-sm" data-pushev="${ev.id}" data-bidx="${bIdx}">Push</button>`;
      html += `</div>`;
    } else if (!isCommish()) {
      html += `<div class="card-sub">${bet.settled ? "Settled" : pending.length + " pending — Rex grades"}</div>`;
    }

    // Per-bet ledger with individual undo — commissioner only
    if (isCommish()) {
      graded.forEach(b => {
        const col = b.status === "won" ? "var(--green)" : b.status === "lost" ? "var(--red)" : "var(--orange)";
        const lbl = { won:"Won", lost:"Lost", push:"Push" }[b.status] || b.status;
        html += `<div class="row" style="justify-content:space-between;font-size:0.82rem;padding:0.25rem 0;border-top:1px solid var(--line);">
          <span>${esc(nameOf(b.player))} · ${esc(b.optionLabel)} · ${fmtMoney(b.wager)} → <strong style="color:${col}">${lbl}</strong></span>
          <button class="btn-gray btn-sm" data-undobet="${b.id}">Undo</button></div>`;
      });
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

/* ============================================================
   WIRING
   ============================================================ */
function wireSignIn() {
  const emailEl = document.getElementById("si-email");
  const passEl  = document.getElementById("si-pass");
  const msg     = document.getElementById("si-msg");
  const show = (cls, text) => { msg.innerHTML = `<div class="${cls}">${text}</div>`; };

  document.getElementById("si-go")?.addEventListener("click", async () => {
    const email = (emailEl.value || "").trim();
    if (!email || !passEl.value) { show("err", "Enter your email and password."); return; }
    try { await signInWithEmailAndPassword(auth, email, passEl.value); }
    catch (e) { show("err", friendlyAuthError(e)); }
  });
  document.getElementById("si-link")?.addEventListener("click", async () => {
    const email = (emailEl.value || "").trim();
    if (!email) { show("err", "Enter your email first, then tap this."); return; }
    try {
      await sendSignInLinkToEmail(auth, email, { url: window.location.href.split("?")[0], handleCodeInApp: true });
      window.localStorage.setItem("gsEmailForLink", email);
      show("ok", `Check <strong>${esc(email)}</strong> and tap the link on this device. Look in junk if it's not there in a minute.`);
    } catch (e) { show("err", friendlyAuthError(e)); }
  });
  document.getElementById("si-reset")?.addEventListener("click", async () => {
    const email = (emailEl.value || "").trim();
    if (!email) { show("err", "Enter your email first, then tap this."); return; }
    try { await sendPasswordResetEmail(auth, email); show("ok", `Sent a password link to <strong>${esc(email)}</strong>.`); }
    catch (e) { show("err", friendlyAuthError(e)); }
  });
  passEl?.addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("si-go").click(); });
}
function wireNotMember() {
  document.getElementById("nm-signout")?.addEventListener("click", () => signOut(auth));
}
function friendlyAuthError(e) {
  const code = e && e.code ? e.code : "";
  if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found")
    return "That email and password don't match. Use the sign-in link or reset your password below.";
  if (code === "auth/too-many-requests") return "Too many attempts — wait a few minutes.";
  if (code === "auth/invalid-email") return "That doesn't look like a valid email.";
  return "Couldn't sign in" + (code ? ` (${code})` : "") + ".";
}

function wireMain() {
  document.getElementById("signout")?.addEventListener("click", () => signOut(auth));
  appEl.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => {

  }));

  appEl.querySelectorAll(".opt-pill").forEach(pill => pill.addEventListener("click", () => {
    if (pill.dataset.locked === "1") return;
    selected = {
      eventId: pill.dataset.event, betIdx: +pill.dataset.bidx, optIdx: +pill.dataset.oidx,
      odds: parseInt(pill.dataset.odds, 10), label: pill.dataset.label,
      betLabel: pill.dataset.betlabel, eventTitle: pill.dataset.eventtitle,

function wireAdmin() {
  // Bet-type toggles reveal their inputs
  appEl.querySelectorAll(".bt-toggle").forEach(cb => {
    const map = { "bt-ml":"sub-ml", "bt-sp":"sub-sp", "bt-to":"sub-to", "bt-prop":"sub-prop" };
    cb.addEventListener("change", () => {
      const sub = document.getElementById(map[cb.id]);
      if (sub) sub.hidden = !cb.checked;
      if (cb.id === "bt-prop" && cb.checked && !document.querySelector(".prop-row")) addPropRow();
    });
  });
  document.getElementById("add-prop")?.addEventListener("click", addPropRow);
  document.getElementById("create-event")?.addEventListener("click", createEvent);

  // Balances (commissioner)
  document.getElementById("save-balances")?.addEventListener("click", async () => {
    const inputs = appEl.querySelectorAll(".bal-edit");
    for (const inp of inputs) {
      const v = parseFloat(inp.value);
      if (isNaN(v)) { toast("Invalid balance for " + inp.dataset.id, "error"); return; }
      if ((cBalances[inp.dataset.id] ?? 0) !== v) await setDoc(doc(db, "custom_balances", inp.dataset.id), { amount: v });
    }
    toast("Balances saved");
  });

  // Edit / lock / delete
  appEl.querySelectorAll("[data-editev]").forEach(b => b.addEventListener("click", () => { editingEventId = b.dataset.editev; render(); }));
  document.getElementById("cancel-edit")?.addEventListener("click", () => { editingEventId = null; render(); });
  document.getElementById("save-edit")?.addEventListener("click", saveEdit);
  appEl.querySelectorAll("[data-lockev]").forEach(b => b.addEventListener("click", async () => {
    await updateDoc(doc(db, "custom_events", b.dataset.lockev), { locked: b.dataset.locked !== "1" });
    toast(b.dataset.locked === "1" ? "Unlocked" : "Locked");
  }));
  appEl.querySelectorAll("[data-delev]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm("Delete this event? Pending bets are refunded.")) return;
    const evId = b.dataset.delev;
    for (const bet of cBets.filter(x => x.eventId === evId && x.status === "pending")) {
      await setDoc(doc(db, "custom_balances", bet.player), { amount: (cBalances[bet.player] ?? 0) + bet.wager });
      await updateDoc(doc(db, "custom_bets", bet.id), { status: "deleted" });
    }
    await deleteDoc(doc(db, "custom_events", evId));
    toast("Event deleted, pending bets refunded");
  }));

  // Grading (commissioner)
  appEl.querySelectorAll("[data-settleev]").forEach(b => b.addEventListener("click", () => gradeWinner(b.dataset.settleev, +b.dataset.bidx, +b.dataset.oidx)));
  appEl.querySelectorAll("[data-losev]").forEach(b => b.addEventListener("click", () => gradeNoWinner(b.dataset.losev, +b.dataset.bidx)));
  appEl.querySelectorAll("[data-pushev]").forEach(b => b.addEventListener("click", () => gradePush(b.dataset.pushev, +b.dataset.bidx)));
  appEl.querySelectorAll("[data-undobet]").forEach(b => b.addEventListener("click", () => undoBet(b.dataset.undobet)));
}

/* ---------- custom prop builder ---------- */
function addPropRow() {
  const host = document.getElementById("prop-builder");
  if (!host) return;
  const div = document.createElement("div");
  div.className = "prop-row card";
  div.innerHTML = `
    <label class="field"><span>Prop label</span><input class="inp prop-label" placeholder="e.g. First TD scorer — over 1.5"></label>
    <div class="prop-opts">
      <div class="row-tight" style="margin-bottom:0.3rem;">
        <input class="inp prop-opt-label" placeholder="Option (e.g. Yes)" style="flex:1;">
        <input class="inp prop-opt-odds" type="number" placeholder="odds" value="-110" style="width:6rem;">
      </div>
      <div class="row-tight" style="margin-bottom:0.3rem;">
        <input class="inp prop-opt-label" placeholder="Option (e.g. No)" style="flex:1;">
        <input class="inp prop-opt-odds" type="number" placeholder="odds" value="-110" style="width:6rem;">
      </div>
    </div>
    <button class="btn-ghost btn-sm prop-add-opt" type="button">+ Add option</button>`;
  host.appendChild(div);
  div.querySelector(".prop-add-opt").addEventListener("click", () => {
    const opts = div.querySelector(".prop-opts");
    const r = document.createElement("div");
    r.className = "row-tight"; r.style.marginBottom = "0.3rem";
    r.innerHTML = `<input class="inp prop-opt-label" placeholder="Option" style="flex:1;">
      <input class="inp prop-opt-odds" type="number" placeholder="odds" value="-110" style="width:6rem;">`;
    opts.appendChild(r);
  });
}

/* ---------- create event (typed) ---------- */
async function createEvent() {
  const title = (document.getElementById("ce-title").value || "").trim();
  const sideA = (document.getElementById("ce-a").value || "").trim();
  const sideB = (document.getElementById("ce-b").value || "").trim();
  const startRaw = document.getElementById("ce-start").value;
  const startTime = startRaw ? new Date(startRaw).getTime() : null;
  const openNow = document.getElementById("ce-opennow").checked;
  if (!title) { toast("Enter an event title.", "error"); return; }

  const bets = [];
  const num = id => { const v = parseFloat(document.getElementById(id).value); return isNaN(v) ? null : v; };
  const intOdds = id => { const v = parseInt(document.getElementById(id).value, 10); return isNaN(v) ? -110 : v; };

  if (document.getElementById("bt-ml").checked) {
    if (!sideA || !sideB) { toast("Moneyline needs both side names.", "error"); return; }
    bets.push({ label: "Moneyline", options: [
      { label: sideA, odds: intOdds("ml-a") }, { label: sideB, odds: intOdds("ml-b") },
    ], settled: false, winnerIdx: null });
  }
  if (document.getElementById("bt-sp").checked) {
    const line = num("sp-line");
    if (!sideA || !sideB || line === null) { toast("Spread needs both sides and a line.", "error"); return; }
    const aLine = line, bLine = -line;
    bets.push({ label: "Spread", options: [
      { label: `${sideA} ${aLine > 0 ? "+" : ""}${aLine}`, odds: intOdds("sp-a") },
      { label: `${sideB} ${bLine > 0 ? "+" : ""}${bLine}`, odds: intOdds("sp-b") },
    ], settled: false, winnerIdx: null });
  }
  if (document.getElementById("bt-to").checked) {
    const n = num("to-num");
    if (n === null) { toast("Total needs a number.", "error"); return; }
    bets.push({ label: "Total", options: [
      { label: `Over ${n}`, odds: intOdds("to-o") }, { label: `Under ${n}`, odds: intOdds("to-u") },
    ], settled: false, winnerIdx: null });
  }
  if (document.getElementById("bt-prop").checked) {
    document.querySelectorAll(".prop-row").forEach(row => {
      const label = (row.querySelector(".prop-label").value || "").trim();
      if (!label) return;
      const options = [];
      row.querySelectorAll(".row-tight").forEach(r => {
        const ol = (r.querySelector(".prop-opt-label").value || "").trim();
        const oo = parseInt(r.querySelector(".prop-opt-odds").value, 10);
        if (ol && !isNaN(oo)) options.push({ label: ol, odds: oo });
      });
      if (options.length) bets.push({ label, options, settled: false, winnerIdx: null });
    });
  }

  if (bets.length === 0) { toast("Pick at least one bet type.", "error"); return; }

  await addDoc(collection(db, "custom_events"), {
    title, subtitle: startTime ? fmtDateLabel(startTime) : (openNow ? "Live now" : ""),
    sideA, sideB, startTime, ignoreTimeLock: openNow,
    bets, locked: false, archived: false,
    createdBy: myId(), createdAt: Date.now(),
  });
  createDraft = null;
  toast("Event created");
  activeTab = "board";
  render();
}

async function saveEdit() {
  const evId = document.getElementById("save-edit").dataset.evid;
  const ev = events.find(e => e.id === evId);
  if (!ev) return;
  const title = (document.getElementById("edit-title").value || "").trim();
  if (!title) { toast("Title can't be empty.", "error"); return; }
  const startRaw = document.getElementById("edit-start").value;
  const startTime = startRaw ? new Date(startRaw).getTime() : null;
  const openNow = document.getElementById("edit-opennow").checked;

  const newBets = (ev.bets || []).map((bet, bIdx) => {
    const lblEl = document.querySelector(`.edit-bet-label[data-bidx="${bIdx}"]`);
    const nb = { ...bet, label: (lblEl && lblEl.value.trim()) || bet.label };
    nb.options = (bet.options || []).map((opt, oIdx) => {
      const ol = document.querySelector(`.edit-opt-label[data-bidx="${bIdx}"][data-oidx="${oIdx}"]`);
      const oo = document.querySelector(`.edit-opt-odds[data-bidx="${bIdx}"][data-oidx="${oIdx}"]`);
      const o = { ...opt };
      if (ol && !ol.disabled && ol.value.trim()) o.label = ol.value.trim();
      if (oo && !oo.disabled) { const v = parseInt(oo.value, 10); if (!isNaN(v)) o.odds = v; }
      return o;
    });
    return nb;
  });

  await updateDoc(doc(db, "custom_events", evId), {
    title, startTime, ignoreTimeLock: openNow,
    subtitle: startTime ? fmtDateLabel(startTime) : (openNow ? "Live now" : (ev.subtitle || "")),
    bets: newBets,
  });
  editingEventId = null;
  toast("Event updated");
  render();
}

/* ---------- grading (commissioner) ---------- */
async function gradeWinner(evId, bIdx, oIdx) {
  const ev = events.find(e => e.id === evId); const bet = ev?.bets?.[bIdx]; if (!bet) return;
  if (!confirm(`Settle "${bet.label}" — winner: ${bet.options[oIdx].label}?`)) return;
  for (const b of cBets.filter(x => x.eventId === evId && x.betIdx === bIdx && x.status === "pending")) {
    const result = b.optIdx === oIdx ? "won" : "lost";
    await updateDoc(doc(db, "custom_bets", b.id), { status: result });
    if (result === "won") await setDoc(doc(db, "custom_balances", b.player), { amount: (cBalances[b.player] ?? 0) + b.wager + b.toWin });
  }
  const nb = [...ev.bets]; nb[bIdx] = { ...bet, settled: true, winnerIdx: oIdx };
  await updateDoc(doc(db, "custom_events", evId), { bets: nb });
  toast(`Settled: ${bet.options[oIdx].label} wins`);
}
async function gradeNoWinner(evId, bIdx) {
  const ev = events.find(e => e.id === evId); const bet = ev?.bets?.[bIdx]; if (!bet) return;
  if (!confirm(`Settle "${bet.label}" as NO WINNER? Every bet on it loses.`)) return;
  for (const b of cBets.filter(x => x.eventId === evId && x.betIdx === bIdx && x.status === "pending"))
    await updateDoc(doc(db, "custom_bets", b.id), { status: "lost" });
  const nb = [...ev.bets]; nb[bIdx] = { ...bet, settled: true, winnerIdx: -1 };
  await updateDoc(doc(db, "custom_events", evId), { bets: nb });
  toast("Settled — no winner");
}
async function gradePush(evId, bIdx) {
  const ev = events.find(e => e.id === evId); const bet = ev?.bets?.[bIdx]; if (!bet) return;
  if (!confirm(`Push "${bet.label}" — refund every wager?`)) return;
  for (const b of cBets.filter(x => x.eventId === evId && x.betIdx === bIdx && x.status === "pending")) {
    await updateDoc(doc(db, "custom_bets", b.id), { status: "push" });
    await setDoc(doc(db, "custom_balances", b.player), { amount: (cBalances[b.player] ?? 0) + b.wager });
  }
  const nb = [...ev.bets]; nb[bIdx] = { ...bet, settled: true, winnerIdx: null };
  await updateDoc(doc(db, "custom_events", evId), { bets: nb });
  toast("Push — wagers refunded");
}
async function undoBet(betId) {
  const b = cBets.find(x => x.id === betId); if (!b) return;
  if (!confirm(`Undo ${nameOf(b.player)}'s bet on "${b.optionLabel}" (${b.status})? Balance is reversed and the bet returns to pending.`)) return;
  let delta = 0;
  if (b.status === "won")  delta = -(b.wager + b.toWin);
  if (b.status === "push") delta = -(b.wager);
  if (delta !== 0) await setDoc(doc(db, "custom_balances", b.player), { amount: (cBalances[b.player] ?? 0) + delta });
  await updateDoc(doc(db, "custom_bets", betId), { status: "pending" });
  const ev = events.find(e => e.id === b.eventId);
  if (ev && ev.bets && ev.bets[b.betIdx]) {
    const nb = [...ev.bets]; nb[b.betIdx] = { ...nb[b.betIdx], settled: false, winnerIdx: null };
    await updateDoc(doc(db, "custom_events", b.eventId), { bets: nb });
  }
  toast(`Undone — ${nameOf(b.player)}'s bet is pending again`);
}

/* ---------- bet slip ---------- */
function showSlip() {
  document.querySelector(".slip")?.remove();
  if (!selected) return;
  const slip = document.createElement("div");
  slip.className = "slip";
  slip.innerHTML = `<div class="slip-inner">
    <div class="slip-head">
      <div><span class="lbl">${esc(selected.label)}</span> <span class="od">${fmtOdds(selected.odds)}</span>
        <div class="sub">${esc(selected.eventTitle)} — ${esc(selected.betLabel)}</div></div>
      <button class="slip-close" id="slip-close">✕</button>
    </div>
    <div class="slip-row">
      <input type="number" id="slip-wager" placeholder="Wager ($)" min="1" step="0.01">
      <button class="btn" id="slip-place">Place bet</button>
    </div>
    <div class="slip-calc" id="slip-calc"></div>
    <div class="slip-err" id="slip-err"></div>
  </div>`;
  document.body.appendChild(slip);
  const wager = document.getElementById("slip-wager");
  wager.focus();
  wager.addEventListener("input", () => {
    const a = parseFloat(wager.value) || 0;
    document.getElementById("slip-calc").textContent = a > 0 ? `To win ${fmtMoney(calcPayout(a, selected.odds))}` : "";
  });
  document.getElementById("slip-close").addEventListener("click", () => { slip.remove(); selected = null; });
  document.getElementById("slip-place").addEventListener("click", async () => {
    const amt = parseFloat(wager.value);
    const err = document.getElementById("slip-err");
    if (!amt || amt < 1) { err.textContent = "Enter a valid wager."; return; }
    if (cBets.find(b => b.player === myId() && b.eventId === selected.eventId && b.betIdx === selected.betIdx && b.optIdx === selected.optIdx && b.status === "pending")) {
      err.textContent = "You already have this bet."; return;
    }
    const toWin = calcPayout(amt, selected.odds);
    await addDoc(collection(db, "custom_bets"), {
      player: myId(), eventId: selected.eventId, eventTitle: selected.eventTitle,
      betIdx: selected.betIdx, betLabel: selected.betLabel, optIdx: selected.optIdx,
      optionLabel: selected.label, odds: selected.odds, wager: amt, toWin,
      status: "pending", createdAt: serverTimestamp(),
    });
    await setDoc(doc(db, "custom_balances", myId()), { amount: (cBalances[myId()] ?? 0) - amt });
    slip.remove(); selected = null;
    toast("Bet placed");
  });
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot() {
  initFirebase();
  // Complete an email-link sign-in if we arrived via one.
  if (isSignInWithEmailLink(auth, window.location.href)) {
    let email = window.localStorage.getItem("gsEmailForLink");
    if (!email) email = window.prompt("Confirm your email to finish signing in:");
    try {
      await signInWithEmailLink(auth, email, window.location.href);
      window.localStorage.removeItem("gsEmailForLink");
      history.replaceState(null, "", window.location.pathname);
    } catch (e) {
      toast("Sign-in link invalid or expired — request a new one.", "error");
    }
  }
  onAuthStateChanged(auth, user => {
    if (user) {
      authEmail = user.email;
      currentMember = memberByEmail(user.email);
      if (currentMember) { ensureBalance(myId()); subscribe(); }
      else { unsubscribeAll(); }
    } else {
      authEmail = null; currentMember = null; unsubscribeAll();
    }
    render();
  });
}
boot();
